
name: Deploy YASH TECH to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify project files
        run: |
          test -f package.json || {
            echo "ERROR: package.json not found in repository root."
            exit 1
          }
          test -f astro.config.mjs || {
            echo "ERROR: astro.config.mjs not found in repository root."
            exit 1
          }

      - name: Install dependencies
        run: npm install

      - name: Check Astro project
        run: npx astro check
        continue-on-error: false

      - name: Build Astro website
        run: npm run build
        env:
          GITHUB_ACTIONS: "true"

      - name: Verify build output
        run: |
          test -f dist/index.html || {
            echo "ERROR: dist/index.html was not generated."
            exit 1
          }

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
